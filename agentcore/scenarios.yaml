# NSCLC Insight Engine - Demo Scenarios
# Fast demo set: keeps visible question text on structured data paths.

version: "1.3"
last_updated: "2026-05-28"
total_questions: 30

demo_path:
  - patient_drug_matching.q1

categories:

  - id: cohort_overview
    order: 1
    title: "코호트 / 데이터 개요"
    title_en: "Cohort Overview"
    description: "시연 도입부에서 데이터 규모와 변이 분포를 빠르게 보여주는 질문."
    icon: "📊"
    questions:
      - id: q1
        text: "TCGA 1,897명에서 actionable mutation 보유 비율과 상위 유전자 5개"
        tools: [get_patient_mutation, list_actionable_genes]
        expected_keywords:
          - "1,897"
          - "actionable"
          - "EGFR"
          - "KRAS"

      - id: q2
        text: "EGFR 변이 빈도와 L858R/T790M 맥락을 숫자 중심으로 요약"
        tools: [get_patient_mutation, list_actionable_genes]
        expected_keywords:
          - "EGFR"
          - "L858R"
          - "T790M"

      - id: q3
        text: "KRAS 변이 빈도와 G12C 비중을 숫자로 요약"
        tools: [get_patient_mutation, list_actionable_genes]
        expected_keywords:
          - "KRAS"
          - "G12C"
          - "487"
          - "202"

      - id: q4
        text: "ALK, MET, BRAF, ERBB2 등 주요 actionable gene 빈도 비교"
        tools: [list_actionable_genes]
        expected_keywords:
          - "ALK"
          - "MET"
          - "BRAF"
          - "ERBB2"

  - id: patient_drug_matching
    order: 2
    title: "환자 변이 → 약물 매칭"
    title_en: "Patient Mutation Matching"
    description: "환자 변이에서 바로 약물 후보로 이어지는 시연 흐름."
    icon: "👤"
    questions:
      - id: q1
        text: "Osimertinib의 EGFR L858R/T790M 근거를 허가·가이드라인, 모델 점수, 세포주 반응으로 5줄 요약"
        stable_demo: true
        tools: [check_in_library, get_drug_metadata, get_oof_prediction, get_ensemble_probability, get_drug_response, search_clinical_knowledge_base]
        expected_keywords:
          - "Osimertinib"
          - "EGFR"
          - "T790M"
          - "0.6238"
          - "PRISM"

      - id: q2
        text: "Sotorasib의 KRAS G12C 근거를 허가·가이드라인, 모델 점수, 변이 빈도로 요약"
        tools: [check_in_library, get_drug_metadata, get_patient_mutation, get_oof_prediction, get_ensemble_probability, search_clinical_knowledge_base]
        expected_keywords:
          - "Sotorasib"
          - "KRAS G12C"
          - "487"
          - "202"

      - id: q3
        text: "EGFR L858R/T790M 환자 프로파일에서 우선 검토 약물 3개"
        tools: [get_patient_mutation, match_patient_drugs, search_drugs, get_ensemble_probability]
        expected_keywords:
          - "EGFR"
          - "Osimertinib"
          - "Model B"

      - id: q4
        text: "KRAS G12C 환자 프로파일에서 우선 검토 약물 3개"
        tools: [get_patient_mutation, match_patient_drugs, search_drugs, get_ensemble_probability]
        expected_keywords:
          - "KRAS"
          - "G12C"
          - "Sotorasib"

      - id: q5
        text: "MET 변이 또는 증폭 환자 프로파일에서 확인할 타겟 약물 3개"
        tools: [list_actionable_genes, match_patient_drugs, search_drugs]
        expected_keywords:
          - "MET"
          - "target"

  - id: drug_library
    order: 3
    title: "약물 라이브러리 탐색"
    title_en: "Drug Library"
    description: "약물 이름, 타겟, 임상 단계가 바로 나오는 빠른 조회형 질문."
    icon: "💊"
    questions:
      - id: q1
        text: "NSCLC에서 이미 허가 또는 임상 근거가 있는 EGFR 타겟 약물 목록"
        tools: [search_drugs, get_drug_metadata]
        expected_keywords:
          - "EGFR"
          - "Osimertinib"

      - id: q2
        text: "약물 재창출 후보 11개를 내부 등급명 없이 이름·타겟·근거로 정리"
        tools: [search_drugs, get_drug_metadata]
        expected_keywords:
          - "11"
          - "target"

      - id: q3
        text: "KRAS를 타겟으로 하는 라이브러리 약물과 임상 단계 요약"
        tools: [search_drugs, get_drug_metadata]
        expected_keywords:
          - "KRAS"
          - "Sotorasib"

      - id: q4
        text: "임상 단계가 높은 NSCLC 관련 후보 약물 top 10"
        tools: [search_drugs, get_drug_metadata]
        expected_keywords:
          - "Phase"
          - "top 10"

      - id: q5
        text: "Osimertinib이 라이브러리에 포함되는지와 주요 타겟을 확인"
        tools: [check_in_library, get_drug_metadata]
        expected_keywords:
          - "in_library"
          - "EGFR"

  - id: model_trust
    order: 4
    title: "모델 해석 / 신뢰도"
    title_en: "Model Trust"
    description: "점수, SHAP, 한계를 짧게 설명하는 질문."
    icon: "🧠"
    questions:
      - id: q1
        text: "PR-AUC 0.1383을 발표용으로 의미와 한계까지 4문장 설명"
        tools: [validate_clinical_claim]
        expected_keywords:
          - "0.1383"
          - "mechanism hypothesis"
          - "한계"

      - id: q2
        text: "Osimertinib의 ensemble probability, 교차검증 점수, 실제 레이블을 한 표로 정리"
        tools: [check_in_library, get_oof_prediction, get_ensemble_probability]
        expected_keywords:
          - "0.6238"
          - "y_true"
          - "OOF"

      - id: q3
        text: "Imatinib SHAP 상위 근거를 화학·생물·세포주 신호로 나눠 설명"
        tools: [check_in_library, get_oof_prediction, get_shap_explanation]
        expected_keywords:
          - "SHAP"
          - "pic50"
          - "morgan"

      - id: q4
        text: "라이브러리 밖 화합물에는 왜 champion 모델 점수를 직접 주지 않는가"
        tools: [check_scope, validate_clinical_claim]
        expected_keywords:
          - "scope"
          - "analog"
          - "mechanism hypothesis"

      - id: q5
        text: "모델 점수와 허가·가이드라인 근거를 구분해서 설명"
        tools: [validate_clinical_claim, search_clinical_knowledge_base]
        expected_keywords:
          - "모델"
          - "가이드라인"
          - "임상 검증"

  - id: cell_line_response
    order: 5
    title: "세포주 반응 분석"
